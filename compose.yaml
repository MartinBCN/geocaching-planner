# Local services for `mise run dev`. Every published port must stay on 127.0.0.1 (ADR-0002);
# backend/tests/unit/test_compose_ports.py enforces this.
name: geocaching-planner

services:
  db:
    image: postgis/postgis:17-3.5
    # The image publishes only amd64; on arm64 hosts this runs under emulation.
    platform: linux/amd64
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-geocaching}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-geocaching}
      POSTGRES_DB: ${POSTGRES_DB:-geocaching}
    ports:
      # Host port is configurable with DB_PORT; GCP_DATABASE_URL must use the same port.
      - "127.0.0.1:${DB_PORT:-5432}:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s

  brouter:
    build:
      context: ./infra/brouter
    restart: unless-stopped
    ports:
      # Host port is configurable with BROUTER_PORT; loopback only (ADR-0002).
      - "127.0.0.1:${BROUTER_PORT:-17777}:17777"
    volumes:
      # Segments (*.rd5) are downloaded by `mise run brouter:segments`; the service starts without them.
      - ./infra/brouter/segments:/data/segments:ro
      - ./infra/brouter/profiles:/data/profiles:ro
    healthcheck:
      test: ["CMD-SHELL", "curl -s -o /dev/null http://127.0.0.1:17777/ || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 15s

volumes:
  db-data:
