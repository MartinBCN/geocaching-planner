# Exact tool pins (ADR-0007). Do not use floating aliases such as `lts` or `latest`.
# Pin changes are made explicitly and recorded in the tooling ticket's completion notes.
[tools]
python = "3.14.9"
node = "24.22.1"        # Node 24 is the current Active LTS major
uv = "0.13.5"
pnpm = "12.15.0"
gitleaks = "8.30.1"

[env]
# Load .env when present so a clean clone can run `mise run setup` before it exists.
_.file = { path = ".env", redact = true, required = false }
# Trust the OS certificate store so Node tools (pnpm, Playwright, Vite) work behind corporate TLS proxies.
NODE_USE_SYSTEM_CA = "1"

[tasks.setup]
description = "Install pinned pre-commit hooks and create .env from .env.example if absent"
run = """
set -eu
uvx pre-commit@4.7.0 install --install-hooks --hook-type pre-commit
uv sync --locked --project backend
pnpm --dir frontend install --frozen-lockfile
pnpm --dir frontend exec playwright install chromium
if [ ! -f .env ]; then cp .env.example .env; fi
"""

[tasks."ci:setup:backend"]
description = "Install locked backend dependencies for CI"
run = "uv sync --locked --project backend"

[tasks."ci:setup:frontend"]
description = "Install locked frontend dependencies for CI"
run = "pnpm --dir frontend install --frozen-lockfile"

[tasks."ci:setup:e2e"]
description = "Install backend, frontend, and Chromium dependencies for E2E CI"
depends = ["ci:setup:backend", "ci:setup:frontend"]
run = "pnpm --dir frontend exec playwright install --with-deps chromium"

[tasks."build:frontend"]
description = "Build the production frontend"
dir = "frontend"
run = "pnpm build"

[tasks."test:e2e:ci"]
description = "Run E2E smoke tests against a DB-only CI stack"
run = "bash scripts/test-e2e-ci.sh"

[tasks."check:pre-commit"]
description = "Run all pre-commit hooks against every file (fails on any hook failure)"
run = "uvx pre-commit@4.7.0 run --all-files"

[tasks.fmt]
description = "Run the fixing hooks and backend formatter across the repository"
depends = ["fmt:backend", "fmt:frontend"]
run = "uvx pre-commit@4.7.0 run --all-files || uvx pre-commit@4.7.0 run --all-files"

[tasks."test:bootstrap"]
description = "Automated checks for the tooling bootstrap (tasks, hooks, layout, ignore rules)"
run = "scripts/verify-bootstrap.sh all"

[tasks.lint]
description = "Lint: pre-commit hooks, bootstrap checks, and backend lint"
depends = ["check:pre-commit", "test:bootstrap", "lint:backend", "lint:frontend"]

[tasks.check]
description = "All quality gates (same set as CI). Must never call a not-yet-implemented task."
depends = ["check:pre-commit", "test:bootstrap", "check:backend", "check:frontend"]

[tasks.dev]
description = "Start the dev stack: preflight, compose db and brouter, migrations, backend with reload, and Vite (T-003, T-004)"
run = "uv run --locked --project backend python -m geocaching_planner.devstack"

[tasks.test]
description = "Run all tests (backend and frontend)"
depends = ["test:backend", "test:frontend"]

[tasks."test:backend"]
description = "Backend tests with the 85% coverage gate (owned by T-002)"
dir = "backend"
run = "uv run --locked pytest --cov-report=term-missing --cov-report=xml:coverage.xml"

[tasks."lint:backend"]
description = "Backend lint and format check (ruff)"
dir = "backend"
run = "uv run --locked ruff check . && uv run --locked ruff format --check ."

[tasks."fmt:backend"]
description = "Backend auto-fix and format (ruff)"
dir = "backend"
run = "uv run --locked ruff check --fix . && uv run --locked ruff format ."

[tasks."typecheck:backend"]
description = "Backend strict type check (mypy)"
dir = "backend"
run = "uv run --locked mypy src tests"

[tasks."check:backend"]
description = "All backend quality gates: lint, typecheck, tests"
depends = ["lint:backend", "typecheck:backend", "test:backend"]

[tasks."verify:python:314"]
description = "Locked sync on Python 3.14 and import every runtime package (AC11)"
dir = "backend"
run = """
set -euo pipefail
uv sync --locked
uv run --locked python -c "import sys; assert sys.version_info[:2] == (3, 14), sys.version"
uv run --locked python -c "import fastapi, uvicorn, pydantic_settings, structlog, pydantic, httpx"
"""

[tasks."test:frontend"]
description = "Frontend unit and component tests with the 80% line coverage gate (T-004)"
dir = "frontend"
run = "pnpm test:coverage"

[tasks."test:e2e"]
description = "E2E smoke tests; Playwright starts mise run dev (needs Docker and Chromium, T-004)"
dir = "frontend"
run = "pnpm e2e"

[tasks."lint:frontend"]
description = "Frontend lint and format check (Biome)"
dir = "frontend"
run = "pnpm lint"

[tasks."fmt:frontend"]
description = "Frontend auto-fix and format (Biome)"
dir = "frontend"
run = "pnpm fmt"

[tasks."typecheck:frontend"]
description = "Frontend strict type check (tsc)"
dir = "frontend"
run = "pnpm typecheck"

[tasks."check:frontend"]
description = "All frontend quality gates: lint, typecheck, tests with coverage, API schema drift (T-004)"
depends = ["lint:frontend", "typecheck:frontend", "test:frontend", "api:check"]

[tasks."db:migrate"]
description = "Apply database migrations to the configured database (T-003)"
dir = "backend"
run = "uv run --locked alembic upgrade head"

[tasks."db:revision"]
description = "Create a new migration; pass the message after -- (T-003)"
dir = "backend"
run = "uv run --locked alembic revision --autogenerate -m \"$MIGRATION_MESSAGE\""

[tasks."test:compose:db"]
description = "Compose db service becomes healthy and migrates (needs Docker, T-003)"
dir = "backend"
run = "uv run --locked pytest -m compose_stack tests/compose/test_compose_db.py --no-cov"

[tasks."test:compose:dev"]
description = "mise run dev reaches a healthy /api/v1/health with db ok (needs Docker, T-003)"
run = "scripts/test-compose-dev.sh"

[tasks."api:gen"]
description = "Regenerate the frontend API types from the backend OpenAPI document (T-004)"
run = "scripts/api-schema.sh gen"

[tasks."api:check"]
description = "Fail if the committed frontend API schema is out of date (T-004)"
run = "scripts/api-schema.sh check"

[tasks."brouter:fetch"]
description = "Download the pinned BRouter release ZIP into infra/brouter/.cache (T-023)"
run = "sh infra/brouter/fetch-release.sh"

[tasks."brouter:segments"]
description = "Download BRouter routing segments (BROUTER_SEGMENTS, default E0_N50,E5_N50) (T-023)"
run = "uv run --locked --project backend python backend/scripts/brouter_segments.py"
